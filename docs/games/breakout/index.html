<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 480px;
      max-width: 95vw;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
    }
    #canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
    }
    .msg-box {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.9);
      width: 480px;
      height: 380px;
      max-width: 95vw;
      border-radius: 8px;
    }
    .btn {
      margin-top: 14px;
      padding: 8px 20px;
      background: #f43f5e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score" style="color: #f43f5e;">0</span></div>
    <div>LIVES: <span id="lives" style="color: #fbbf24;">3</span></div>
  </div>

  <div style="position: relative;">
    <canvas id="canvas" width="480" height="380"></canvas>
    <div id="msg-box" class="msg-box">
      <h2 id="msg-title" style="font-size: 26px; margin-bottom: 8px;">GAME OVER</h2>
      <p id="msg-desc">You scored 0 points</p>
      <button class="btn" onclick="startNewGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Move paddle with Mouse or Left/Right Arrow keys</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const msgBox = document.getElementById('msg-box');
    const msgTitle = document.getElementById('msg-title');
    const msgDesc = document.getElementById('msg-desc');

    const paddleHeight = 12;
    let paddleWidth = 85;
    let paddleX = (canvas.width - paddleWidth) / 2;

    const ballRadius = 6;
    let x, y, dx, dy;
    let score = 0;
    let lives = 3;
    let isGameOver = false;

    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 56;
    const brickHeight = 18;
    const brickPadding = 8;
    const brickOffsetTop = 30;
    const brickOffsetLeft = 20;

    const colors = ['#f43f5e', '#fb923c', '#fbbf24', '#34d399', '#38bdf8'];
    let bricks = [];

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: colors[r] };
        }
      }
    }

    function resetBall() {
      x = canvas.width / 2;
      y = canvas.height - 35;
      dx = (Math.random() > 0.5 ? 2.5 : -2.5);
      dy = -3.5;
    }

    function startNewGame() {
      score = 0;
      lives = 3;
      scoreEl.innerText = score;
      livesEl.innerText = lives;
      isGameOver = false;
      msgBox.style.display = 'none';
      initBricks();
      resetBall();
    }

    // Mouse movement
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddleX = Math.max(0, Math.min(canvas.width - paddleWidth, relativeX - paddleWidth / 2));
      }
    });

    // Keyboard support
    let rightPressed = false;
    let leftPressed = false;
    window.addEventListener('keydown', e => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = true;
      else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd') rightPressed = false;
      else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a') leftPressed = false;
    });

    function collisionDetection() {
      let remaining = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            remaining++;
            if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
              dy = -dy;
              b.status = 0;
              score += 15;
              scoreEl.innerText = score;
            }
          }
        }
      }
      if (remaining === 0) {
        isGameOver = true;
        msgTitle.innerText = 'CONGRATULATIONS!';
        msgTitle.style.color = '#34d399';
        msgDesc.innerText = `You cleared all bricks! Score: ${score}`;
        msgBox.style.display = 'flex';
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.beginPath();
            ctx.rect(brickX, brickY, brickWidth, brickHeight);
            ctx.fillStyle = bricks[c][r].color;
            ctx.fill();
            ctx.closePath();
          }
        }
      }

      // Draw ball
      ctx.beginPath();
      ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.closePath();

      // Draw paddle
      ctx.beginPath();
      ctx.rect(paddleX, canvas.height - paddleHeight - 8, paddleWidth, paddleHeight);
      ctx.fillStyle = '#f43f5e';
      ctx.fill();
      ctx.closePath();

      if (!isGameOver) {
        collisionDetection();

        // Bounce left and right
        if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
          dx = -dx;
        }

        // Bounce top
        if (y + dy < ballRadius) {
          dy = -dy;
        } else if (y + dy > canvas.height - paddleHeight - 8 - ballRadius) {
          // Check paddle collision
          if (x >= paddleX - ballRadius && x <= paddleX + paddleWidth + ballRadius) {
            // angle based on hit location
            const hitRatio = (x - (paddleX + paddleWidth / 2)) / (paddleWidth / 2);
            dx = hitRatio * 4;
            dy = -Math.abs(dy);
          } else if (y + dy > canvas.height - ballRadius) {
            lives--;
            livesEl.innerText = lives;
            if (lives <= 0) {
              isGameOver = true;
              msgTitle.innerText = 'GAME OVER';
              msgTitle.style.color = '#f43f5e';
              msgDesc.innerText = `Final Score: ${score}`;
              msgBox.style.display = 'flex';
            } else {
              resetBall();
            }
          }
        }

        if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 6;
        if (leftPressed && paddleX > 0) paddleX -= 6;

        x += dx;
        y += dy;
      }

      requestAnimationFrame(draw);
    }

    startNewGame();
    draw();
  </script>
</body>
</html>
