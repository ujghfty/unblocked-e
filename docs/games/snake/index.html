<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 440px;
      max-width: 95vw;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .score-box { font-size: 14px; font-weight: 600; }
    .score-val { color: #10b981; font-size: 18px; font-mono: true; margin-left: 4px; }
    #canvas {
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .controls-hint {
      margin-top: 12px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .game-over-overlay {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      width: 440px;
      height: 440px;
      max-width: 95vw;
      max-height: 95vw;
      border-radius: 8px;
    }
    .btn {
      margin-top: 16px;
      padding: 10px 24px;
      background: #10b981;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover { background: #34d399; transform: scale(1.03); }
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(2, 45px);
      gap: 6px;
      margin-top: 12px;
    }
    .touch-btn {
      background: #334155;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 600px) {
      .touch-controls { display: grid; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="score-box">SCORE: <span id="score" class="score-val">0</span></div>
    <div class="score-box">BEST: <span id="high-score" class="score-val">0</span></div>
  </div>

  <div style="position: relative;">
    <canvas id="canvas" width="440" height="440"></canvas>
    <div id="overlay" class="game-over-overlay">
      <h2 style="color: #ef4444; font-size: 28px; margin-bottom: 8px;">GAME OVER</h2>
      <p id="final-score" style="color: #cbd5e1; font-size: 16px;">Score: 0</p>
      <button class="btn" id="restart-btn" onclick="startGame()">PLAY AGAIN</button>
      <span style="font-size: 12px; color: #64748b; margin-top: 8px;">Press Space or Enter</span>
    </div>
  </div>

  <div class="controls-hint">Use Arrow Keys or WASD to control • Space to Pause</div>

  <div class="touch-controls">
    <div></div>
    <button class="touch-btn" onclick="setDir('UP')">▲</button>
    <div></div>
    <button class="touch-btn" onclick="setDir('LEFT')">◀</button>
    <button class="touch-btn" onclick="setDir('DOWN')">▼</button>
    <button class="touch-btn" onclick="setDir('RIGHT')">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high_score') || 0;
    highScoreEl.innerText = highScore;

    let gameLoop = null;
    let isGameOver = false;
    let isPaused = false;

    // Audio effects using Web Audio API
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function beep(freq, duration) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      score = 0;
      scoreEl.innerText = score;
      isGameOver = false;
      isPaused = false;
      overlay.style.display = 'none';
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 100);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDir(direction) {
      if (isGameOver) { startGame(); return; }
      if (direction === 'UP' && dy !== 1) { dx = 0; dy = -1; }
      if (direction === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
      if (direction === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
      if (direction === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
    }

    function update() {
      if (isPaused || isGameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.innerText = score;
        beep(587, 0.08);
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_high_score', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isGameOver = true;
      clearInterval(gameLoop);
      beep(150, 0.3);
      finalScoreEl.innerText = `Final Score: ${score}`;
      overlay.style.display = 'flex';
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      const fx = food.x * gridSize + gridSize / 2;
      const fy = food.y * gridSize + gridSize / 2;
      ctx.arc(fx, fy, gridSize / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      snake.forEach((seg, index) => {
        if (index === 0) {
          ctx.fillStyle = '#10b981'; // Head
        } else {
          ctx.fillStyle = '#059669'; // Body
        }
        ctx.fillRect(seg.x * gridSize + 1, seg.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { setDir('UP'); e.preventDefault(); }
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { setDir('DOWN'); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { setDir('LEFT'); e.preventDefault(); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { setDir('RIGHT'); e.preventDefault(); }
      else if (e.key === ' ' || e.key === 'Enter') {
        if (isGameOver) startGame();
        else isPaused = !isPaused;
      }
    });

    startGame();
  </script>
</body>
</html>
