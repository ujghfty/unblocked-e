<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Wings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #canvas {
      background: #70c5ce;
      border: 3px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="360" height="512"></canvas>
  <div class="hint">Click, Tap, or Press Space to Jump</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let birdY = 200;
    let velocity = 0;
    const gravity = 0.35;
    const jump = -6.5;
    const birdSize = 16;

    let pipes = [];
    let frame = 0;
    let score = 0;
    let highScore = localStorage.getItem('flappy_best') || 0;
    let gameState = 'START'; // 'START', 'PLAY', 'OVER'

    function resetGame() {
      birdY = 200;
      velocity = 0;
      pipes = [];
      frame = 0;
      score = 0;
      gameState = 'PLAY';
    }

    function jumpAction() {
      if (gameState === 'START' || gameState === 'OVER') {
        resetGame();
      } else if (gameState === 'PLAY') {
        velocity = jump;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === ' ' || e.key === 'ArrowUp') {
        e.preventDefault();
        jumpAction();
      }
    });
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      jumpAction();
    });

    function update() {
      frame++;

      if (gameState === 'PLAY') {
        velocity += gravity;
        birdY += velocity;

        // Ground / Ceiling hit
        if (birdY > canvas.height - 40 - birdSize || birdY < 0) {
          gameOver();
        }

        // Spawn pipes
        if (frame % 90 === 0) {
          const gap = 120;
          const minPipe = 50;
          const topHeight = Math.floor(Math.random() * (canvas.height - 100 - gap - minPipe)) + minPipe;
          pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: topHeight + gap,
            passed: false
          });
        }

        // Move pipes
        for (let i = 0; i < pipes.length; i++) {
          const p = pipes[i];
          p.x -= 2.2;

          // Score point
          if (!p.passed && p.x + 50 < 60) {
            score++;
            p.passed = true;
            if (score > highScore) {
              highScore = score;
              localStorage.setItem('flappy_best', highScore);
            }
          }

          // Collision detection
          const birdLeft = 60 - birdSize;
          const birdRight = 60 + birdSize;
          const birdTop = birdY - birdSize;
          const birdBottom = birdY + birdSize;

          if (birdRight > p.x && birdLeft < p.x + 50) {
            if (birdTop < p.top || birdBottom > p.bottom) {
              gameOver();
            }
          }
        }

        // Filter offscreen pipes
        pipes = pipes.filter(p => p.x > -60);
      }
    }

    function gameOver() {
      gameState = 'OVER';
    }

    function draw() {
      // Sky background
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(80, 80, 24, 0, Math.PI * 2);
      ctx.arc(110, 75, 30, 0, Math.PI * 2);
      ctx.arc(140, 80, 24, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      for (const p of pipes) {
        // Top pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, p.top - 20, 54, 20);

        // Bottom pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.bottom, 50, canvas.height - p.bottom - 40);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 2, p.bottom, 54, 20);
      }

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#4ade80';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);

      // Bird
      ctx.save();
      ctx.translate(60, birdY);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (velocity * 4) * Math.PI / 180));
      ctx.rotate(angle);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, birdSize, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(8, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(12, -2);
      ctx.lineTo(20, 2);
      ctx.lineTo(12, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      // UI
      if (gameState === 'START') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FLAPPY WINGS', canvas.width / 2, 210);
        ctx.font = '15px sans-serif';
        ctx.fillText('Tap or Space to Flap', canvas.width / 2, 250);
      } else if (gameState === 'PLAY') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(score, canvas.width / 2, 60);
        ctx.shadowBlur = 0;
      } else if (gameState === 'OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 190);
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px sans-serif';
        ctx.fillText(`Score: ${score}`, canvas.width / 2, 230);
        ctx.fillText(`Best: ${highScore}`, canvas.width / 2, 260);
        ctx.font = 'bold 15px sans-serif';
        ctx.fillStyle = '#facc15';
        ctx.fillText('Tap or Space to Restart', canvas.width / 2, 310);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
