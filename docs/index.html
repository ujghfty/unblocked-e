    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'><rect width='20' height='12' x='2' y='6' rx='6'/><path d='M12 12h.01M15 12h.01M9 12h.01M6 12h.01'/></svg>" />
    <script>
      // When raw source index.html is served directly on GitHub Pages without Vite build,
      // seamlessly forward the browser to the pre-built /docs/ production bundle.
      (function() {
        try {
          var isCompiled = !!document.querySelector('link[href*="assets/"]') || !!document.querySelector('script[src*="assets/"]');
          var isGitHubPages = window.location.hostname.endsWith('github.io');
          if (!isCompiled && isGitHubPages && !window.location.pathname.includes('/docs')) {
            var target = window.location.pathname.replace(/\/+$/, '') + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-D3-LW46L.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BqEH6mcd.css">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root">
      <div id="portal-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #020617; color: #94a3b8; text-align: center; padding: 20px;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #8b5cf6); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          <svg style="width: 26px; height: 26px; color: white;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect width="20" height="12" x="2" y="6" rx="6"></rect>
            <path d="M6 12h4m-2-2v4m7-1h.01m3-2h.01" stroke-linecap="round"></path>
          </svg>
        </div>
        <h2 style="color: #f8fafc; font-size: 1.15rem; font-weight: 700; margin: 0 0 6px 0;">Unblocked Games Portal</h2>
        <p style="font-size: 0.85rem; color: #64748b; max-width: 420px; margin: 0 0 16px 0;">Loading JSON games catalog and iframe engine...</p>
        <noscript>
          <div style="margin-top: 16px; padding: 12px 18px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 8px; color: #fca5a5; font-size: 0.85rem;">
            JavaScript is required to run the game portal.
          </div>
        </noscript>
      </div>
    </div>
    <!-- Vite entry point -->
    <script>
      // Diagnostic helper if raw index.html is loaded on GitHub Pages without building
      window.addEventListener('error', function (e) {
        var loader = document.getElementById('portal-loader');
        if (loader && (!window.__REACT_MOUNTED__)) {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.children.length <= 1) {
              loader.innerHTML = `
                <div style="max-width: 520px; margin: 20px auto; padding: 24px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; color: #f8fafc; text-align: center;">
                  <div style="font-size: 36px; margin-bottom: 8px;">🎮</div>
                  <h3 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #fff;">GitHub Pages Deployment</h3>
                  <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0 0 16px 0;">
                    Vite applications require a production build to run on GitHub Pages.
                  </p>
                  <div style="text-align: left; background: #020617; padding: 14px; border-radius: 10px; font-size: 12px; color: #cbd5e1; border: 1px solid #1e293b;">
                    <div style="font-weight: 600; color: #a5b4fc; margin-bottom: 6px;">How to enable automated deployment:</div>
                    1. In your GitHub repository, click <strong>Settings</strong>.<br/>
                    2. In the left sidebar, click <strong>Pages</strong>.<br/>
                    3. Under <strong>Build and deployment ➔ Source</strong>, switch to <strong>GitHub Actions</strong>.<br/>
                    4. The included <code>.github/workflows/deploy.yml</code> will auto-build and publish your games portal!
                  </div>
                </div>
              `;
            }
          }, 800);
        }
      });
    </script>
  </body>
</html>
