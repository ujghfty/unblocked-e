<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #06b6d4;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 600px;
      max-width: 95vw;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .mode-select {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }
    .mode-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .mode-btn.active {
      background: #0891b2;
      color: white;
      border-color: #06b6d4;
    }
    #canvas {
      background: #020617;
      border: 3px solid #0891b2;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);
    }
    .footer-note {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>PLAYER 1: <span id="p1-score">0</span></div>
    <div>PONG</div>
    <div>PLAYER 2 / AI: <span id="p2-score">0</span></div>
  </div>

  <div class="mode-select">
    <button class="mode-btn active" id="btn-1p" onclick="setMode('1p')">1 Player (vs AI)</button>
    <button class="mode-btn" id="btn-2p" onclick="setMode('2p')">2 Player (W/S & Up/Down)</button>
  </div>

  <canvas id="canvas" width="600" height="380"></canvas>

  <div class="footer-note" id="control-note">
    Player 1: W / S or Mouse | First to 7 wins
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1-score');
    const p2ScoreEl = document.getElementById('p2-score');
    const controlNote = document.getElementById('control-note');

    let mode = '1p'; // '1p' or '2p'

    const paddleWidth = 12;
    const paddleHeight = 70;
    let p1Y = (canvas.height - paddleHeight) / 2;
    let p2Y = (canvas.height - paddleHeight) / 2;
    let p1Score = 0;
    let p2Score = 0;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 5;
    let ballSpeedY = 3;
    const ballSize = 10;

    const keys = {};

    function setMode(m) {
      mode = m;
      document.getElementById('btn-1p').className = 'mode-btn ' + (m === '1p' ? 'active' : '');
      document.getElementById('btn-2p').className = 'mode-btn ' + (m === '2p' ? 'active' : '');
      controlNote.innerText = m === '1p' 
        ? 'Player 1: W / S or Move Mouse | First to 7 wins'
        : 'P1: W / S Keys | P2: Up / Down Arrow Keys | First to 7 wins';
      resetGame();
    }

    function resetGame() {
      p1Score = 0;
      p2Score = 0;
      p1ScoreEl.innerText = '0';
      p2ScoreEl.innerText = '0';
      resetBall();
    }

    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * 5;
      ballSpeedY = (Math.random() * 4 - 2);
    }

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', e => {
      if (mode === '1p') {
        const rect = canvas.getBoundingClientRect();
        p1Y = e.clientY - rect.top - paddleHeight / 2;
        p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));
      }
    });

    function update() {
      // P1 controls
      if (keys['w'] || keys['W']) p1Y -= 6;
      if (keys['s'] || keys['S']) p1Y += 6;
      p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));

      // P2 controls
      if (mode === '2p') {
        if (keys['ArrowUp']) p2Y -= 6;
        if (keys['ArrowDown']) p2Y += 6;
      } else {
        // AI logic
        const centerP2 = p2Y + paddleHeight / 2;
        if (centerP2 < ballY - 14) p2Y += 4.5;
        else if (centerP2 > ballY + 14) p2Y -= 4.5;
      }
      p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));

      // Ball move
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Top / bottom bounce
      if (ballY <= 0 || ballY >= canvas.height - ballSize) {
        ballSpeedY = -ballSpeedY;
      }

      // Left paddle collision
      if (ballX <= 20 + paddleWidth && ballX >= 20) {
        if (ballY + ballSize >= p1Y && ballY <= p1Y + paddleHeight) {
          ballSpeedX = Math.abs(ballSpeedX) * 1.05;
          const hitPos = (ballY - (p1Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedY = hitPos * 6;
        }
      }

      // Right paddle collision
      if (ballX + ballSize >= canvas.width - 20 - paddleWidth && ballX + ballSize <= canvas.width - 20) {
        if (ballY + ballSize >= p2Y && ballY <= p2Y + paddleHeight) {
          ballSpeedX = -Math.abs(ballSpeedX) * 1.05;
          const hitPos = (ballY - (p2Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedY = hitPos * 6;
        }
      }

      // Point scoring
      if (ballX < 0) {
        p2Score++;
        p2ScoreEl.innerText = p2Score;
        checkWin();
        resetBall();
      } else if (ballX > canvas.width) {
        p1Score++;
        p1ScoreEl.innerText = p1Score;
        checkWin();
        resetBall();
      }
    }

    function checkWin() {
      if (p1Score >= 7 || p2Score >= 7) {
        const winner = p1Score >= 7 ? 'PLAYER 1' : (mode === '1p' ? 'AI' : 'PLAYER 2');
        setTimeout(() => {
          alert(`${winner} WINS!`);
          resetGame();
        }, 50);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 4;
      ctx.setLineDash([10, 10]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle
      ctx.fillStyle = '#06b6d4';
      ctx.fillRect(20, p1Y, paddleWidth, paddleHeight);

      // P2 Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(canvas.width - 20 - paddleWidth, p2Y, paddleWidth, paddleHeight);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ballX, ballY, ballSize, ballSize);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
